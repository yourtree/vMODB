# Example configuration file for enabling io_uring support in vMODB

# Network options
network_thread_pool_size=4
network_buffer_size=0
so_buffer_size=0
network_send_timeout=0

# MODB options
vms_thread_pool_size=4
num_vms_workers=1
max_sleep=50

# Storage options with io_uring support

## Enable logical logging with io_uring
logging=true
# Options: default, compressed, iouring, compressed_iouring
logging_type=iouring

## Enable checkpointing with io_uring backend
checkpointing=true
# Options: default, iouring
storage_backend=iouring

## Primary index configuration
max_records=1000000

# Note: To use io_uring features, ensure:
# 1. The system has Linux kernel 5.1+ with io_uring support
# 2. The native library is compiled with liburing
# 3. The user has appropriate permissions for io_uring operations 